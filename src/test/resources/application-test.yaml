spring:
  application:
    name: Noddi-Test-H2
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: testpassword

jwt:
  secret: testsecretkeytestsecretkeytestsecretkey1234567890abcdefghijklmnopqrst
  access-token-expiration: 3600000

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

daily:
  api:
    key: test-daily-key
  webhook:
    secret: test-webhook-secret
openai:
  api-key: ${OPENAI_API_KEY:test-openai-key}
  audio:
    # 운영 설정과 같은 기본값을 사용해 테스트 컨텍스트에서도 설정 주입 여부를 확인한다.
    max-file-size-bytes: 25000000
    download-connect-timeout-ms: 10000
    download-read-timeout-ms: 60000
