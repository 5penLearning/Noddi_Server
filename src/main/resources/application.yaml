spring:
  application:
    name: Noddi
  datasource:
    url: jdbc:mysql://mutsa-db.cj6iy2ouw106.ap-northeast-2.rds.amazonaws.com:3306/Noddi?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: ${PROFILE_IMAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${PROFILE_IMAGE_MAX_REQUEST_SIZE:6MB}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      pinecone:
        api-key: ${PINECONE_API_KEY}
        index-name: ${PINECONE_INDEX_NAME}

  # Mail (SMTP) 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} # 발송 서버 계정 이메일
    password: ${MAIL_PASSWORD} # Google 앱 발급 비밀번호 (16자리)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
scheduler:
  invite:
    cron: "0 0 * * * *"
    zone: Asia/Seoul
    valid-days: 7
  meeting-ai:
    # PROCESSING 상태가 고립되었는지 5분마다 검사한다.
    recovery-cron: "${MEETING_AI_RECOVERY_CRON:0 */5 * * * *}"
    zone: "${MEETING_AI_RECOVERY_ZONE:Asia/Seoul}"
    # 정상 처리 시간을 충분히 고려해 30분을 초과한 작업만 FAILED로 복구한다.
    processing-timeout-minutes: ${MEETING_AI_PROCESSING_TIMEOUT_MINUTES:30}
    # PENDING 타임아웃 추가 (기본 10분)
    pending-timeout-minutes: ${MEETING_AI_PENDING_TIMEOUT_MINUTES:10}
  qa-ai:
    recovery-cron: "${QA_AI_RECOVERY_CRON:0 */5 * * * *}"
    zone: "${QA_AI_RECOVERY_ZONE:Asia/Seoul}"
    processing-timeout-minutes: ${QA_AI_PROCESSING_TIMEOUT_MINUTES:10}
  qa-knowledge:
    recovery-cron: "${QA_KNOWLEDGE_RECOVERY_CRON:0 */5 * * * *}"
    zone: "${QA_KNOWLEDGE_RECOVERY_ZONE:Asia/Seoul}"

jwt:
  secret: ${JWT_SECRET} #환경변수 설정 필요
  # 8시간 (21,600,000 ms)으로 넉넉하게 변경 - 회의 중 튕김 방지. refreshToken 도입 후 변경 고려
  access-token-expiration: 21600000
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

daily:
  api:
    key: ${DAILY_API_KEY}
  webhook:
    secret: ${WEBHOOK_SECRET} # Base64 아니고 평문, 환경변수 설정 필요

springdoc:
  use-fqn: true #스웨거 클래스명 충돌 방지

openai:
  api-key: ${OPENAI_API_KEY}
  audio:
    # OpenAI 파일 전사 API의 25MB 업로드 제한을 넘기기 전에 백엔드에서 다운로드를 중단한다.
    max-file-size-bytes: ${OPENAI_AUDIO_MAX_FILE_SIZE_BYTES:25000000}
    # Daily 녹음 파일 서버와 연결이 만들어질 때까지 기다리는 최대 시간(ms)이다.
    download-connect-timeout-ms: ${OPENAI_AUDIO_DOWNLOAD_CONNECT_TIMEOUT_MS:10000}
    # 연결 이후 파일 데이터 수신이 멈췄을 때 기다리는 최대 시간(ms)이다.
    download-read-timeout-ms: ${OPENAI_AUDIO_DOWNLOAD_READ_TIMEOUT_MS:60000}

qa:
  ai:
    max-generation-attempts: ${QA_AI_MAX_GENERATION_ATTEMPTS:3}
    # 정상적인 AI 호출 실패는 2초, 4초 순으로 짧게 재시도한다.
    retry-base-delay-millis: ${QA_AI_RETRY_BASE_DELAY_MILLIS:2000}
  rag:
    top-k: ${QA_RAG_TOP_K:5} # 사용자의 질문과 가장 유사한 청크를 몇 개까지 가져올 것인지 설정
    similarity-threshold: ${QA_RAG_SIMILARITY_THRESHOLD:0.2} # 현재 검증 데이터 기준 하한선이며 평가 결과에 따라 환경변수로 조정

profile-image:
  # 로컬에서는 local, EC2 운영 환경에서는 s3로 지정한다.
  storage-type: ${PROFILE_IMAGE_STORAGE_TYPE:local}
  max-file-size-bytes: ${PROFILE_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
  local:
    storage-path: ${PROFILE_IMAGE_STORAGE_PATH:./uploads/profile-images}
  s3:
    bucket: ${PROFILE_IMAGE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    prefix: ${PROFILE_IMAGE_S3_PREFIX:profile-images}

# 시연 데이터는 명시적으로 활성화한 한 번의 배포에서만 생성한다.
# 관계형 데이터 생성 후 회의 전사와 공유페이지를 실제 Pinecone 색인 흐름으로 전달한다.
demo-data:
  enabled: ${DEMO_DATA_ENABLED:false}
  password: "${DEMO_DATA_PASSWORD:Demo1234!}"
