spring:
  application:
    name: Noddi
  datasource:
    url: jdbc:mysql://mutsa-db.cj6iy2ouw106.ap-northeast-2.rds.amazonaws.com:3306/Noddi?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    redis:
      host: localhost
      port: 6379

  # Mail (SMTP) 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} # 발송 서버 계정 이메일
    password: ${MAIL_PASSWORD} # Google 앱 발급 비밀번호 (16자리)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
scheduler:
  team-invite:
    cron: "0 0 * * * *"
    zone: Asia/Seoul
    valid-days: 7

jwt:
  secret: ${JWT_SECRET} #환경변수 설정 필요
  access-token-expiration: 3600000
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

daily:
  api:
    key: ${DAILY_API_KEY}
  webhook:
    secret: ${WEBHOOK_SECRET} # Base64 아니고 평문, 환경변수 설정 필요