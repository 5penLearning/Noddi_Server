name: Noddi Server CI/CD (Develop Auto Deploy)

on:
  push:
    branches: [ "develop", "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 21 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 4. GitHub 클라우드에서 JAR 파일 빌드
        run: ./gradlew build -x test

      - name: 5. 완성된 JAR 파일만 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/Noddi-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu"
          strip_components: 2

      - name: 6. EC2 자바 서비스 재시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart noddi.service
            echo "[GitHub Actions] EC2 자동 배포 및 noddi.service 재시작 완료!"
